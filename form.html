<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <h3>Registration Form</h3>
    <fieldset id="form-field">
<label for="fname" name="fname" id="fname">First Name</label>
<input type="text" placeholder="First Name"><br><br><br>
<label for="lastname" name="lastname" id="lname">Last Name</label>
<input type="text" placeholder="Last Name"><br><br><br>
<label for="email" name="email" id="email">Email</label>
<input type="email" placeholder="Email"><br><br><br>
<label for="Preferred date" id="date">Your preferred date</label><br>
<input type="date"><br><br><br>
<label for="Preferred time" id="time">Your preferred time</label><br>
<input type="time">
    </fieldset>
</body>
</html>
